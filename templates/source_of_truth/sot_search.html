{% extends "base.html" %}
{% block title %}Search · Source of Truth{% endblock %}
{% block content %}
<div class="space-y-4">
  <div class="flex items-center justify-between flex-wrap gap-2">
    <div>
      <h1 class="text-2xl font-bold">Search Source of Truth</h1>
      <p class="text-sm text-muted mt-1">Hybrid keyword + semantic search across pages and how-tos.</p>
    </div>
    <a href="{{ url_for('source_of_truth.dashboard') }}"
       class="px-3 py-2 bg-surface text-foreground rounded-button text-sm font-medium border border-border hover:bg-surface-hover transition no-underline">← Back</a>
  </div>

  <div class="bg-surface border border-border rounded-card p-4">
    <input id="q" type="text" autofocus
           value="{{ q|e }}"
           placeholder="e.g. how do I find decaying content"
           class="w-full px-4 py-3 rounded-button bg-background border border-border text-foreground placeholder-muted focus:outline-none focus:border-accent transition" />
    <div id="status" class="text-xs text-muted mt-2"></div>
  </div>

  <div id="results" class="space-y-3"></div>
</div>

<style>
  mark { background: rgba(250, 204, 21, 0.35); color: inherit; padding: 0 2px; border-radius: 2px; }
  .hit-pill { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); }
  .hit-pill.howto { background: rgba(59,130,246,.12); border-color: rgba(59,130,246,.35); color: #93c5fd; }
  .hit-pill.insights { background: rgba(168,85,247,.12); border-color: rgba(168,85,247,.35); color: #d8b4fe; }
  .hit-pill.concepts { background: rgba(16,185,129,.12); border-color: rgba(16,185,129,.35); color: #6ee7b7; }
  .hit-pill.both { background: rgba(250,204,21,.12); border-color: rgba(250,204,21,.35); color: #fde68a; }
</style>

<script>
let seq = 0;
const qInput = document.getElementById("q");
let dbT;
qInput.addEventListener("input", () => {
  clearTimeout(dbT);
  dbT = setTimeout(run, 220);
});
qInput.addEventListener("keydown", e => { if (e.key === "Enter") { clearTimeout(dbT); run(); } });

function classify(hit) {
  const path = hit.file_path || "";
  if (path.startsWith("howtos/")) return "howto";
  if (path.endsWith("insights.md")) return "insights";
  if (path.endsWith("concepts.md")) return "concepts";
  return null;
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}

function renderHit(hit) {
  const kind = classify(hit) || "page";
  const both = (hit.rank_fts && hit.rank_semantic) ? '<span class="hit-pill both ml-1">both</span>'
              : hit.rank_fts ? '<span class="hit-pill ml-1">keyword</span>'
              : '<span class="hit-pill ml-1">semantic</span>';
  const crumb = [hit.title, hit.section_title].filter(Boolean).map(escapeHtml).join(" › ");

  // Prefer in-app routes when we can; else fall back to GitHub blob URL.
  let inAppHref = null;
  if (kind === "howto") {
    inAppHref = "/applications/source_of_truth/howto/view/" + encodeURI(hit.file_path);
  } else if (kind === "insights" || kind === "concepts") {
    inAppHref = "/applications/source_of_truth/" + kind;
  }
  const primaryHref = inAppHref || hit.url;
  const primaryTarget = inAppHref ? "_self" : "_blank";

  return `
    <a href="${primaryHref}" target="${primaryTarget}" rel="noopener"
       class="block bg-surface border border-border rounded-card p-4 hover:bg-surface-hover transition no-underline">
      <div class="flex items-center gap-2 mb-1 flex-wrap">
        <span class="hit-pill ${kind}">${kind}</span>
        ${both}
        <span class="text-xs text-muted">${crumb}</span>
      </div>
      <div class="text-base font-semibold text-foreground">${escapeHtml(hit.title || hit.file_path)}</div>
      <div class="text-sm text-muted mt-1 leading-relaxed">${hit.snippet}</div>
      <div class="text-xs text-muted mt-2">
        <a href="${hit.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()"
           class="text-accent hover:text-accent-hover no-underline">View on GitHub →</a>
      </div>
    </a>
  `;
}

async function run() {
  const q = qInput.value.trim();
  const status = document.getElementById("status");
  const results = document.getElementById("results");
  // keep URL in sync so the page is shareable / refresh-safe
  const newUrl = new URL(window.location);
  if (q) newUrl.searchParams.set("q", q); else newUrl.searchParams.delete("q");
  window.history.replaceState({}, "", newUrl);

  if (!q) { status.textContent = ""; results.innerHTML = ""; return; }
  const mine = ++seq;
  status.textContent = "Searching…";
  try {
    const r = await fetch("/applications/source_of_truth/api/search?q=" + encodeURIComponent(q) + "&limit=15");
    const data = await r.json();
    if (mine !== seq) return;
    const hits = data.hits || [];
    status.textContent = hits.length ? `${hits.length} result${hits.length === 1 ? "" : "s"}` : "No results.";
    results.innerHTML = hits.map(renderHit).join("");
  } catch (e) {
    status.textContent = "Error: " + e.message;
  }
}

if (qInput.value.trim()) run();
</script>
{% endblock %}
