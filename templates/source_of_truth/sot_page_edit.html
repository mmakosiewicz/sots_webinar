{% extends "base.html" %}
{% block title %}{{ 'New Page' if is_new else 'Edit: ' + page.title }} — Source of Truth{% endblock %}
{% block content %}
<div class="space-y-4">
  <div class="flex items-center gap-2 text-sm text-muted">
    <a href="{{ url_for('source_of_truth.dashboard') }}" class="hover:text-foreground no-underline">Source of Truth</a>
    <span>/</span>
    <span class="text-foreground">{{ 'New Page' if is_new else 'Edit: ' + page.title }}</span>
  </div>

  <form method="POST" action="{{ url_for('source_of_truth.page_new') if is_new else url_for('source_of_truth.page_edit', path=page.path) }}">
    <div class="space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1">Title</label>
          <input type="text" name="title" value="{{ '' if is_new else page.title }}" required
                 class="w-full px-3 py-2 bg-surface border border-border rounded-md text-foreground focus:outline-none focus:border-border-focus">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Category</label>
          <select name="category" class="w-full px-3 py-2 bg-surface border border-border rounded-md text-foreground focus:outline-none focus:border-border-focus">
            {% for cat in categories %}
            <option value="{{ cat }}" {{ 'selected' if not is_new and page.category == cat else '' }}>{{ cat }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Content (Markdown)</label>
        <textarea name="content" rows="20"
                  class="w-full px-3 py-2 bg-surface border border-border rounded-md text-foreground font-mono text-sm focus:outline-none focus:border-border-focus resize-y">{{ '' if is_new else page.content }}</textarea>
      </div>
      <div class="flex gap-2">
        <button type="submit" class="px-4 py-2 bg-accent text-accent-foreground rounded-button text-sm font-medium hover:bg-accent-hover transition">
          {{ 'Create Page' if is_new else 'Save to GitHub' }}
        </button>
        <a href="{{ url_for('source_of_truth.dashboard') if is_new else url_for('source_of_truth.page_view', path=page.path) }}"
           class="px-4 py-2 bg-surface text-foreground rounded-button text-sm border border-border hover:bg-surface-hover transition no-underline">Cancel</a>
      </div>
    </div>
  </form>
</div>
{% endblock %}
