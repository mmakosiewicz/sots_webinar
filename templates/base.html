<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Source of Truth{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --bg-canvas:         251 250 247;
        --bg-panel:          255 255 255;
        --bg-surface:        255 255 255;
        --bg-surface-hover:  243 241 235;
        --bg-element:        247 245 240;

        --text-default:       15  23  42;
        --text-subtle:       100 116 139;
        --text-muted:        148 163 184;
        --text-on-accent:    255 255 255;

        --border:            226 224 218;
        --border-focus:       99 102 241;

        --accent:             79  70 229;
        --accent-hover:       67  56 202;

        --success:            16 185 129;
        --success-strong:      5 150 105;
        --error:             225  29  72;
        --warning:           217 119   6;
      }
      html, body { background: rgb(251 250 247); color: rgb(15 23 42); }
      body { font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
      .doc-serif { font-family: 'Lora', Georgia, serif; }
      .rounded-button { border-radius: 8px; }
      a.no-underline { text-decoration: none; }
    </style>
    <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Lora', 'Georgia', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            canvas: 'rgb(var(--bg-canvas) / <alpha-value>)',
            panel: 'rgb(var(--bg-panel) / <alpha-value>)',
            surface: {
              DEFAULT: 'rgb(var(--bg-surface) / <alpha-value>)',
              hover: 'rgb(var(--bg-surface-hover) / <alpha-value>)',
            },
            element: 'rgb(var(--bg-element) / <alpha-value>)',
            foreground: 'rgb(var(--text-default) / <alpha-value>)',
            subtle: 'rgb(var(--text-subtle) / <alpha-value>)',
            muted: 'rgb(var(--text-muted) / <alpha-value>)',
            accent: {
              DEFAULT: 'rgb(var(--accent) / <alpha-value>)',
              hover: 'rgb(var(--accent-hover) / <alpha-value>)',
              foreground: 'rgb(var(--text-on-accent) / <alpha-value>)',
            },
            success: {
              DEFAULT: 'rgb(var(--success) / <alpha-value>)',
              strong: 'rgb(var(--success-strong) / <alpha-value>)',
            },
            error: 'rgb(var(--error) / <alpha-value>)',
            warning: 'rgb(var(--warning) / <alpha-value>)',
            border: 'rgb(var(--border) / <alpha-value>)',
          },
          borderRadius: {
            'lg': '12px',
            'button': '8px',
            'DEFAULT': '6px',
            'pill': '99px',
          },
        }
      }
    }
    </script>
    {% block head %}{% endblock %}
</head>
<body class="min-h-screen">
    <nav class="border-b border-border bg-panel">
        <div class="max-w-6xl mx-auto px-6 py-3 flex items-center justify-between">
            <a href="{{ url_for('source_of_truth.dashboard') }}" class="text-base font-semibold text-foreground no-underline">Source of Truth</a>
            <div class="flex items-center gap-1">
                <a href="{{ url_for('source_of_truth.dashboard') }}" class="text-sm px-3 py-1.5 rounded-md no-underline text-subtle hover:text-foreground hover:bg-surface-hover">Home</a>
                <a href="{{ url_for('source_of_truth.ingest_form') }}" class="text-sm px-3 py-1.5 rounded-md no-underline text-subtle hover:text-foreground hover:bg-surface-hover">Ingest</a>
                <a href="{{ url_for('source_of_truth.sources_view') }}" class="text-sm px-3 py-1.5 rounded-md no-underline text-subtle hover:text-foreground hover:bg-surface-hover">Sources</a>
                <a href="{{ url_for('source_of_truth.search_page') }}" class="text-sm px-3 py-1.5 rounded-md no-underline text-subtle hover:text-foreground hover:bg-surface-hover">Search</a>
            </div>
        </div>
    </nav>
    <main class="px-6 py-8 max-w-6xl mx-auto">
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
